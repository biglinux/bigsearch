[package]
name = "big-search-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.big-search]
path = ".."

[[bin]]
name = "xml_text"
path = "fuzz_targets/xml_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "office_zip"
path = "fuzz_targets/office_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_bytes"
path = "fuzz_targets/text_bytes.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
