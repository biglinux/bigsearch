# Standalone benchmark crate — intentionally OUTSIDE the big-search workspace
# (own [workspace] table) so its experimental deps never touch the daemon's
# Cargo.lock / deny.toml / approved-crates.txt. Throwaway: measures the cost of
# metadata extraction approaches; not shipped, not a daemon dependency.
[package]
name = "metadata-bench"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
libc = "0.2"
lofty = "0.21"
imagesize = "0.13"
kamadak-exif = "0.5"
# Broad pure-Rust type detection + a single safe (no-unsafe) demuxer covering
# audio AND mkv/webm/mp4 duration. (infer + lopdf were measured and rejected —
# file-format has wider coverage at the same speed; lopdf cost 92 MB RSS — so
# they're removed rather than kept as unused deps; their numbers stay in the docs.)
file-format = "0.26"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "mkv"] }
