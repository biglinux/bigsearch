msrv = "1.98.1"

# ── Complexity thresholds ──────────────────────────────────────────
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 8
type-complexity-threshold = 300
excessive-nesting-threshold = 10

# ── Naming / style thresholds ─────────────────────────────────────
single-char-binding-names-threshold = 5
enum-variant-name-threshold = 3
struct-field-name-threshold = 3

# ── Size thresholds ───────────────────────────────────────────────
trivial-copy-size-limit = 16
large-error-threshold = 256

# ── Dependency duplicates ─────────────────────────────────────────
allowed-duplicate-crates = []

# Spawning a process is allowed only where the argv, the deadline and the
# size of what is read back have been reviewed: today that is the PDF
# extractor alone, which opts out with a scoped `allow` and says why.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "spawn only behind a reviewed argv, deadline and output cap (see extract_pdf.rs)" },
    { path = "std::io::stdin", reason = "stdin blocks; the daemon has no interactive input" },
]

disallowed-types = [
    { path = "std::process::Command", reason = "spawn only behind a reviewed argv, deadline and output cap (see extract_pdf.rs)" },
]
