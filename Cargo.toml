# Generated snapshot manifest; sources and dependency features are preserved.

[workspace]
resolver = "3"
members = ["apps/big-search", "crates/foundation/big-indexd-client", "crates/foundation/big-search-config", "crates/ui/generic/big-search-settings"]
# The daemon alone by default: the settings page pulls GTK, which the service
# and its package never need.
default-members = ["apps/big-search"]
exclude = ["apps/big-search/fuzz"]
package = { edition = "2024", rust-version = "1.98.1", license = "MIT", repository = "https://github.com/biglinux/big", homepage = "https://github.com/biglinux/big", authors = ["BigLinux contributors"] }

[profile]
dev = { debug = "line-tables-only" }
release = { lto = "thin", codegen-units = 1, strip = "symbols" }
