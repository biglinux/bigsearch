[workspace]
resolver = "3"
members = [
    "apps/big-docinfo",
    "apps/big-search",
    "crates/foundation/big-docinfo",
    "crates/foundation/big-indexd-client",
    "crates/foundation/big-search-config",
]
# The daemon alone by default: the service and its package need nothing else.
default-members = ["apps/big-search"]
exclude = ["apps/big-search/fuzz"]

[workspace.lints.rust]
deprecated = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
exit = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
allow_attributes_without_reason = "deny"
unused_result_ok = "warn"
significant_drop_in_scrutinee = "warn"
unchecked_time_subtraction = "warn"
read_zero_byte_vec = "warn"
path_buf_push_overwrite = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
unnecessary_join = "warn"
manual_instant_elapsed = "warn"
large_futures = "warn"
cast_lossless = "warn"
non_std_lazy_statics = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
ignore_without_reason = "warn"
should_panic_without_expect = "warn"
redundant_test_prefix = "warn"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/biglinux/bigsearch"
homepage = "https://github.com/biglinux/bigsearch"
authors = ["BigLinux contributors"]

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.cargo]
unused_dependencies = "deny"
