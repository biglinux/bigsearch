[workspace]
resolver = "3"
members = [
    "apps/big-docinfo",
    "apps/big-search",
    "crates/foundation/big-docinfo",
    "crates/foundation/big-indexd-client",
    "crates/foundation/big-search-config",
]
# The daemon alone by default: the service and its package need nothing else.
default-members = ["apps/big-search"]
exclude = ["apps/big-search/fuzz"]

[workspace.lints.rust]
deprecated = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
exit = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/biglinux/bigsearch"
homepage = "https://github.com/biglinux/bigsearch"
authors = ["BigLinux contributors"]

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
