name: Feature request
description: Something you would like BigSearch to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The search or task that is hard today, with a concrete example.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Mention if it matters on low-end hardware.
