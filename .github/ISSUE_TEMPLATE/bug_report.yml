name: Bug report
description: Something BigSearch does wrong or fails to do.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: BigSearch version or commit, distribution, filesystem of the indexed folders, and RAM.
      placeholder: |
        big-search 0.1.0 (commit abc1234)
        BigLinux 2026-09, Btrfs, 4 GB RAM
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Status and logs
      description: Output of `big-search status` and relevant lines from `journalctl --user -u big-search`. Remove private file names.
      render: text
