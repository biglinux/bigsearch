name: Bug report
description: Report one reproducible problem in a Big product.
body:
  - type: markdown
    attributes:
      value: "Pre-release software: use disposable data. For sensitive issues use private Security reporting when enabled; otherwise ask a maintainer for a private channel without exploit details."
  - type: textarea
    id: environment
    attributes:
      label: Product and environment
      description: Product, commit, distribution, GTK/driver versions, renderer, standalone/dynamic/builtin-session, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Provide minimal steps and non-sensitive test data. State how often it occurs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and scope
      description: Sanitized logs/screenshots, exact commands, pass/fail/skip counts and tests not run. Remove credentials, private paths and contents.
